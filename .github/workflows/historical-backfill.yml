name: AdvisorX historical baseline backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: Historical 1-minute price-volume window
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3"]

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Run validated backward-paginated candle downloader
        run: python tools/historical_backfill.py --days "${{ inputs.days }}" --out historical_output
      - name: Upload historical baseline
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-historical-${{ inputs.days }}d-${{ github.run_id }}
          path: historical_output/
          retention-days: 14
