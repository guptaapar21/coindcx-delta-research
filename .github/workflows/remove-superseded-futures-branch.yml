name: Remove superseded Futures branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded branch and this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${REPO}/git/refs/heads/Futures-Only"
          echo "Deleted branch Futures-Only"
          WF_SHA="$(gh api "repos/${REPO}/contents/.github/workflows/remove-superseded-futures-branch.yml" --jq '.sha')"
          gh api --method DELETE "repos/${REPO}/contents/.github/workflows/remove-superseded-futures-branch.yml" \
            -f message='Remove one-shot branch cleanup workflow' \
            -f sha="${WF_SHA}" \
            -f branch='main'
          echo "Removed one-shot workflow"
