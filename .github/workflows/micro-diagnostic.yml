name: AdvisorX CoinDCX micro transport diagnostic

on:
  workflow_dispatch: {}

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python tools/micro_diagnostic.py --minutes 4 --out diagnostic_output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-micro-diagnostic-${{ github.run_id }}
          path: diagnostic_output/
          retention-days: 7
