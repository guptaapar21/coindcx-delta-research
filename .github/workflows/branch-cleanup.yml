name: Clean obsolete experimental branches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for branch in \
            Futures-Only-check2 \
            futures-only-code \
            futures-only-test \
            futures-only-tmp \
            futures-only-tmp2 \
            futures-only-tmp3 \
            futures-only-tmp4 \
            noop \
            temp-last; do
            echo "Deleting $branch"
            gh api --method DELETE "/repos/$repo/git/refs/heads/$branch"
          done
