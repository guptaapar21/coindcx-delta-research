name: AdvisorX CoinDCX Futures WebSocket Demo

on:
  workflow_dispatch: {}

jobs:
  futures-ws-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install "python-socketio[client]>=5.11,<6"

      - name: Probe CoinDCX futures websocket
        run: python tools/futures_ws_demo.py --minutes 5 --out futures_ws_demo_output

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-futures-ws-demo-${{ github.run_id }}
          path: futures_ws_demo_output/
          retention-days: 7
