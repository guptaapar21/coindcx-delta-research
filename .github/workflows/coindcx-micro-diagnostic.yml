name: CoinDCX micro diagnostic

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Diagnostic duration in minutes
        required: true
        default: "4"
        type: string

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install "python-socketio[client]>=5.11,<6"
      - name: Run micro diagnostic
        run: python diagnostic.py --minutes "${{ inputs.minutes }}" --out diagnostic_output
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-micro-diagnostic-${{ github.run_id }}
          path: diagnostic_output/
          retention-days: 7
