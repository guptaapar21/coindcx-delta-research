name: Collect CoinDCX research data
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Collection duration (minutes)"
        required: true
        default: "60"
      pairs:
        description: "Optional comma-separated pair override; leave blank for config.json"
        required: false
        default: ""
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect
        shell: bash
        env:
          MINUTES: ${{ inputs.minutes }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          set -e
          if [ -n "$PAIRS" ]; then
            args=()
            IFS=',' read -ra arr <<< "$PAIRS"
            for pair in "${arr[@]}"; do args+=(--pair "$pair"); done
            python scripts/run_collector.py --minutes "$MINUTES" "${args[@]}"
          else
            python scripts/run_collector.py --config config/config.json --minutes "$MINUTES"
          fi
      - name: Validate collected run
        shell: bash
        run: |
          latest=$(find data/raw -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          test -n "$latest"
          python scripts/validate_run.py "$latest"
      - name: Upload collected data
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-research-${{ github.run_id }}
          path: |
            data/raw/**
            data/manifests/**
          retention-days: 14
