name: AdvisorX CoinDCX continuous collector

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Batch duration in minutes (5-230). Production default is 230.
        required: false
        default: "230"
        type: string
  repository_dispatch:
    types: [coindcx-next-batch]

permissions:
  contents: write
  actions: write

concurrency:
  group: advisorx-coindcx-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Determine batch ID
        id: batch
        shell: bash
        run: |
          BATCH_ID="$(date -u +%Y%m%dT%H%M%SZ)_run_${GITHUB_RUN_ID}"
          echo "batch_id=${BATCH_ID}" >> "$GITHUB_OUTPUT"

      - name: Collect raw CoinDCX streams
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes || '230' }}
        run: |
          mkdir -p "runtime/${{ steps.batch.outputs.batch_id }}"
          python src/collector.py \
            --duration-minutes "$DURATION_MINUTES" \
            --out "runtime/${{ steps.batch.outputs.batch_id }}"

      - name: Build research features
        if: always()
        run: |
          python src/research_batch.py --batch "runtime/${{ steps.batch.outputs.batch_id }}"
          python src/depth_validator.py --batch "runtime/${{ steps.batch.outputs.batch_id }}"

      - name: Merge compact 1m history
        if: always()
        run: |
          if test -f "runtime/${{ steps.batch.outputs.batch_id }}/features_1m.csv.gz"; then
            python tools/merge_compact.py \
              --batch "runtime/${{ steps.batch.outputs.batch_id }}" \
              --dest-root "data/research/compact_1m" \
              --dest-root-3m "data/research/compact_3m"
          fi

      - name: Commit compact research state
        if: always()
        shell: bash
        run: |
          git config user.name "advisorx-bot"
          git config user.email "advisorx-bot@users.noreply.github.com"

          git add \
            data/research/compact_1m/ \
            data/research/compact_3m/ \
            data/state/protected_batches.json || true

          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update CoinDCX compact research state" || true
            git push || true
          fi

      - name: Upload raw batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-raw-${{ steps.batch.outputs.batch_id }}
          path: runtime/${{ steps.batch.outputs.batch_id }}/
          retention-days: 4
          compression-level: 0
          if-no-files-found: warn

      - name: Archive/rotate old raw artifacts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/storage_manager.py

      - name: Publish storage report as small artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-storage-report-${{ github.run_id }}
          path: storage_report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Trigger next batch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # repository_dispatch explicitly creates a workflow run when authenticated
          # with GITHUB_TOKEN; this is the self-chain that keeps collection alive.
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPO}/dispatches" \
            -f event_type='coindcx-next-batch' \
            -f client_payload[reason]='previous_batch_finished'
