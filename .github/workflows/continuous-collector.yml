name: AdvisorX CoinDCX continuous collector

on:
  # One controlled bootstrap trigger. It is removed immediately after the
  # bootstrap run is launched; normal production chaining uses repository_dispatch.
  push:
    branches:
      - main
    paths:
      - '.github/CONTINUOUS_BOOTSTRAP'

  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Batch duration in minutes (5-230)"
        required: false
        default: "30"
        type: string

      continue_chain:
        description: "Start/continue automatic batch chaining"
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types:
      - coindcx-next-batch

permissions:
  contents: write
  actions: write

concurrency:
  group: advisorx-coindcx-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Determine batch ID
        id: batch
        shell: bash
        run: |
          BATCH_ID="$(date -u +%Y%m%dT%H%M%SZ)_run_${GITHUB_RUN_ID}"
          echo "batch_id=${BATCH_ID}" >> "$GITHUB_OUTPUT"

      - name: Determine batch duration
        id: duration
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "minutes=230" >> "$GITHUB_OUTPUT"
          else
            echo "minutes=${{ inputs.duration_minutes || '30' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect raw CoinDCX streams
        run: |
          mkdir -p "runtime/${{ steps.batch.outputs.batch_id }}"

          python src/collector.py \
            --duration-minutes "${{ steps.duration.outputs.minutes }}" \
            --out "runtime/${{ steps.batch.outputs.batch_id }}"

      - name: Mark raw collection complete
        id: raw_complete
        if: success()
        shell: bash
        run: |
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Build research features
        if: success()
        run: |
          python src/research_batch.py \
            --batch "runtime/${{ steps.batch.outputs.batch_id }}"

          python src/depth_validator.py \
            --batch "runtime/${{ steps.batch.outputs.batch_id }}"

      - name: Merge compact research history
        if: success()
        run: |
          if test -f "runtime/${{ steps.batch.outputs.batch_id }}/features_1m.csv.gz"; then
            python tools/merge_compact.py \
              --batch "runtime/${{ steps.batch.outputs.batch_id }}" \
              --dest-root "data/research/compact_1m" \
              --dest-root-3m "data/research/compact_3m"
          fi

      - name: Commit compact research state
        if: success()
        shell: bash
        run: |
          git config user.name "advisorx-bot"
          git config user.email "advisorx-bot@users.noreply.github.com"

          git add \
            data/research/compact_1m/ \
            data/research/compact_3m/ \
            data/state/protected_batches.json || true

          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update CoinDCX compact research state" || true
            git push || true
          fi

      - name: Upload raw batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-raw-${{ steps.batch.outputs.batch_id }}
          path: runtime/${{ steps.batch.outputs.batch_id }}/
          retention-days: 4
          compression-level: 0
          if-no-files-found: warn

      - name: Run storage manager
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/storage_manager.py

      - name: Upload storage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-storage-report-${{ github.run_id }}
          path: storage_report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Trigger next production batch
        if: ${{ always() && steps.raw_complete.outputs.complete == 'true' && (github.event_name == 'repository_dispatch' || github.event_name == 'push' || inputs.continue_chain == true) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPO}/dispatches" \
            -f event_type='coindcx-next-batch' \
            -f client_payload[reason]='previous_batch_finished'
