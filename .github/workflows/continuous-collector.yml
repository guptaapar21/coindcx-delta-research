name: AdvisorX CoinDCX continuous collector

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Batch duration in minutes (5-230)"
        required: false
        default: "30"
        type: string
      continue_chain:
        description: "Start/continue automatic batch chaining"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - coindcx-next-batch

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Determine batch ID
        id: batch
        shell: bash
        run: |
          BATCH_ID="$(date -u +%Y%m%dT%H%M%SZ)_run_${GITHUB_RUN_ID}"
          echo "batch_id=${BATCH_ID}" >> "$GITHUB_OUTPUT"

      - name: Determine batch duration
        id: duration
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "minutes=230" >> "$GITHUB_OUTPUT"
          else
            echo "minutes=${{ inputs.duration_minutes || '30' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect raw CoinDCX streams
        run: |
          mkdir -p "runtime/${{ steps.batch.outputs.batch_id }}"
          python src/collector.py \
            --duration-minutes "${{ steps.duration.outputs.minutes }}" \
            --out "runtime/${{ steps.batch.outputs.batch_id }}"

      - name: Mark raw collection complete
        id: raw_complete
        if: success()
        shell: bash
        run: echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Upload raw batch artifact
        id: raw_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-raw-${{ steps.batch.outputs.batch_id }}
          path: runtime/${{ steps.batch.outputs.batch_id }}/
          retention-days: 4
          compression-level: 0
          if-no-files-found: warn

      # Trigger the next collector before any expensive research computation.
      # Downstream processing is handled by process-batch.yml and cannot block
      # continuous raw acquisition.
      - name: Trigger next production batch
        if: ${{ steps.raw_complete.outputs.complete == 'true' && (github.event_name == 'repository_dispatch' || inputs.continue_chain == true) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPO}/dispatches" \
            -f event_type='coindcx-next-batch' \
            -f client_payload[reason]='raw_batch_finished'

      - name: Trigger batch processing
        if: ${{ steps.raw_complete.outputs.complete == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.raw_upload.outputs.artifact-id }}
        shell: bash
        run: |
          test -n "$ARTIFACT_ID"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPO}/dispatches" \
            -f event_type='coindcx-process-batch' \
            -f client_payload[batch_id]="${BATCH_ID}" \
            -f client_payload[source_run_id]="${SOURCE_RUN_ID}" \
            -f client_payload[artifact_id]="${ARTIFACT_ID}"
