name: Backfill CoinDCX historical candles

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical 1m candle window: 1, 2 or 3 days"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install requests

      - name: Download historical data
        run: |
          python historical_backfill.py \
            --days "${{ inputs.days }}" \
            --out historical_output

      - name: Upload historical dataset
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-historical-${{ inputs.days }}d-${{ github.run_id }}
          path: historical_output/
          retention-days: 14
